name: Scheduled Tests

on:
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  scheduled-tests:
    name: Scheduled E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npm run install:browsers
      
      - name: Run regression tests on ${{ matrix.browser }}
        run: npm run test:${{ matrix.browser }}
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.demoblaze.com' }}
          CI: true
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-results-${{ matrix.browser }}
          path: reports/
          retention-days: 60
  
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: scheduled-tests
    if: always()
    
    steps:
      - name: Success notification
        if: success()
        run: echo "✅ Scheduled tests passed on all browsers!"
      
      - name: Failure notification
        if: failure()
        run: echo "❌ Scheduled tests failed. Check run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
