name: Functional Tests (Auto)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Enable manual trigger

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Functional Test - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent hanging jobs
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run functional UI tests on ${{ matrix.browser }}
        run: npx cucumber-js --require-module ts-node/register --profile ${{ matrix.browser }} --tags "@ui"
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.demoblaze.com' }}
          CI: true
        continue-on-error: false
      
      - name: Generate HTML report
        if: always()
        run: npm run report:html
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 30
          compression-level: 6
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: reports/${{ matrix.browser }}/screenshots/
          retention-days: 7
          compression-level: 6

  report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Organize reports
        run: |
          mkdir -p reports
          for browser in chromium firefox webkit; do
            if [ -d "artifacts/test-results-$browser/reports/$browser" ]; then
              cp -r "artifacts/test-results-$browser/reports/$browser" "reports/"
              echo "✅ Copied reports for $browser"
            fi
          done
          ls -la reports/
      
      - name: Generate test summary
        run: node config/report/generate-summary.js
        continue-on-error: true
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summaryContent = '## 📊 E2E Test Results\n\n';
            
            try {
              // Read the summary from the summary file if available
              summaryContent += '✅ Test execution completed. Check the job summary for detailed results.\n\n';
            } catch (error) {
              summaryContent += '📊 Test results are available in the workflow artifacts.\n\n';
            }
            
            summaryContent += '🔗 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summaryContent
            })

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [test, report]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: workflow-status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test.result }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi
      
      - name: Workflow result notification
        run: |
          echo "${{ steps.workflow-status.outputs.emoji }} E2E Tests ${{ steps.workflow-status.outputs.status }}!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
